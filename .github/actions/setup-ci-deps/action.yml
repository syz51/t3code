name: Setup CI dependencies
description: Install Vite+ and the workspace dependencies from cache.
inputs:
  task-cache-read-token:
    description: Read-only credential for the private maintainer task cache
    required: false
    default: ""
  install:
    description: Set to "false" to set up Vite+ and Bun only, with no install cache or install
    required: false
    default: "true"
  install-args:
    description: Arguments for `bun install`, such as filters. Empty installs the whole workspace.
    required: false
    default: ""
  save-install-cache:
    description: Set to "false" when a concurrent job with the same install args saves the install cache
    required: false
    default: "true"
runs:
  using: composite
  steps:
    # ~/.vite-plus holds vp, the Node.js runtime, and the package manager. A cache
    # entry never updates, so the key names all three versions; otherwise a bun or
    # Node.js bump makes every job download them again.
    - name: Resolve Vite+ version
      id: vp
      shell: bash
      run: |
        echo "version=$(jq -r '.workspaces.catalog["vite-plus"] // empty' package.json)" >> "$GITHUB_OUTPUT"
        echo "node=$(jq -r '.engines.node' package.json)" >> "$GITHUB_OUTPUT"
        echo "bun=$(jq -r '.packageManager | sub("^bun@"; "")' package.json)" >> "$GITHUB_OUTPUT"

    # Pinned because release-desktop.yml signs builds with this action in the job.
    - name: Cache Vite+
      id: vp_cache
      if: steps.vp.outputs.version != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.vite-plus
        key: vite-plus-home-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.vp.outputs.version }}-node${{ steps.vp.outputs.node }}-bun@${{ steps.vp.outputs.bun }}

    # setup-vp always runs the installer, which fetches vp from npm even when
    # this exact version is installed. A cache hit already has everything, so
    # skip setup-vp and do its remaining work here. This keeps npm outages from
    # failing jobs.
    - name: Use cached Vite+
      if: steps.vp_cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        echo "$HOME/.vite-plus/bin" >> "$GITHUB_PATH"
        "$HOME/.vite-plus/bin/vp" env use "${{ steps.vp.outputs.node }}"

    # vp gives each Node.js download attempt 10 minutes by default, so one
    # stalled stream holds the job that long. It retries 3 times and resumes
    # partial bytes, so a shorter limit costs a slow download only a retry.
    - name: Setup Vite+
      if: steps.vp_cache.outputs.cache-hit != 'true'
      uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
      env:
        VP_DOWNLOAD_TIMEOUT: "120"
      with:
        node-version-file: package.json
        cache: false
        run-install: false

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: ${{ steps.vp.outputs.bun }}

    # A shared key lets whichever install saves first, often a small filtered
    # one, become every job's cache. Each set of install args gets its own.
    - name: Resolve install cache
      id: bun_cache_dir
      if: inputs.install == 'true'
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      run: |
        echo "path=$(bun pm cache)" >> "$GITHUB_OUTPUT"
        if [[ -z "$INSTALL_ARGS" ]]; then
          echo "namespace=full" >> "$GITHUB_OUTPUT"
        else
          echo "namespace=filtered-$(printf '%s' "$INSTALL_ARGS" | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        fi

    # Filtered installs prefer the current full cache, which holds every package,
    # over an older cache of their own.
    # The install cache stays a cache tarball on the runner's own disk. A cache on a
    # Blacksmith sticky disk mounts in under a second, but installs then copy every
    # package across filesystems instead of hard-linking it: a pnpm install took
    # 28-49s against 9s plus an 11s restore.
    - name: Restore install cache
      id: bun_cache
      if: inputs.install == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.bun_cache_dir.outputs.path }}
        key: bun-${{ steps.bun_cache_dir.outputs.namespace }}-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
        restore-keys: |
          bun-full-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}
          bun-${{ steps.bun_cache_dir.outputs.namespace }}-v1-${{ runner.os }}-${{ runner.arch }}-
          bun-full-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      env:
        INSTALL_ARGS: ${{ inputs.install-args }}
      # Unquoted so each filter is its own argument.
      run: bun install --frozen-lockfile $INSTALL_ARGS

    # A filtered install that started from the current full cache adds nothing
    # worth a second copy of it. A stacked PR, based on a branch other than the
    # default, saves a ~1 GB cache only its own reruns can read, so it only restores.
    # Concurrent jobs with the same install args reserve one key, so the losers
    # compress the cache for nothing; all but one pass save-install-cache: false.
    - name: Save install cache
      if: >-
        inputs.install == 'true' && inputs.save-install-cache == 'true' &&
        (github.event_name != 'pull_request' || github.base_ref == github.event.repository.default_branch) &&
        steps.bun_cache.outputs.cache-hit != 'true' &&
        (steps.bun_cache_dir.outputs.namespace == 'full' ||
          steps.bun_cache.outputs.cache-matched-key != format('bun-full-v1-{0}-{1}-{2}', runner.os, runner.arch, hashFiles('bun.lock', 'package.json')))
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.bun_cache_dir.outputs.path }}
        key: ${{ steps.bun_cache.outputs.cache-primary-key }}

    - name: Enable shared task cache
      if: >-
        github.repository == 'pingdotgg/t3code' &&
        (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
        hashFiles('.task-cache.json') != '' &&
        inputs.task-cache-read-token != ''
      shell: bash
      env:
        T3_TASK_CACHE_READ_TOKEN: ${{ inputs.task-cache-read-token }}
      run: |
        node infra/task-cache/scripts/install-ci.ts
        if [[ ( "$GITHUB_EVENT_NAME" == pull_request && "$GITHUB_BASE_REF" == main ) || ( "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ) ]]; then
          echo 'VP_REMOTE_CACHE=read-write' >> "$GITHUB_ENV"
        else
          echo 'VP_REMOTE_CACHE=read' >> "$GITHUB_ENV"
        fi
